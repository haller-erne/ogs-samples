[GENERAL]
;SidePanelURL=https://mrdoob.com/lab/javascript/webgl/voxels_liquid/index.html
;SidePanelURL=local://sidepanel

; To use the builtin Modbus/TCP server, set ModbusServer=1
;
ModbusServer=0

[SERIAL]
Barcode			=
Barcode_Rfid	=
SocketTray 		=

[SCREEN]
InitialPosition=0,0,2880,1920


[LINE_INTERFACE]
; The LINE_INTERFACE section is used by ogs-line-interface.lua to configure the line interface driver.
; 
; Set ENABLED=1 to enable the line interface, 0 to disable it
ENABLED=1
;
; IO_DRIVER specifies the low-level driver to use for the line interface. In this case, it is set to 
; the Hilscher low-level driver. This basically defines the lua file to load for the line interface.
IO_DRIVER=line-lowlevel-hilscher
; By default the low level driver reads a config section with the name of the driver - to override, 
; set the section name in IO_CONFIG, e.g. IO_CONFIG=line-lowlevel-hilscher
IO_CONFIG=line-lowlevel-hilscher

[line-lowlevel-hilscher]
; The Hilscher card communication channel to use:
; - For a remote card, use "TCP0_cifX0" typically and make sure to drop the correct cifx32dll.dll 
;   and cifx.ini files in the appropriate directory. The cifxTcpServer.exe must be running on the
;   remote machine.
; - For a local card, use "cifx0" and make sure the cifx driver is installed and the card is 
;   configured correctly using the Hilscher Communication Studio software.
CHANNEL=TCP0_cifX0



[OPENPROTO]
;CHANNEL_01=10.10.2.164
;CHANNEL_01_TYPE=NEXO
;CHANNEL_01_CHECK_TIME_ENABLED=1
;;CHANNEL_01_NEXONAR_CHANNEL=6
;;CHANNEL_01_CURVE_REQUEST=1
CHANNEL_01=10.10.2.185
CHANNEL_01_TYPE=OPEX
CHANNEL_01_PORT=4545

; Copy of the CHANNEL_01 tool for use with TASS (see LUA_TASS below)
CHANNEL_11=10.10.2.161
CHANNEL_11_TYPE=NEXO
CHANNEL_11_CHECK_TIME_ENABLED=1
CHANNEL_11_NEXONAR_CHANNEL=6
CHANNEL_11_CURVE_REQUEST=1


[USER]
autologon=il
