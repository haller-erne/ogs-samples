<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcode Scanner</title>
  </head>
  <body>
    <div id="camera-view" class="is-paused">
      <video id="webcam" playsinline muted></video>
      <button id="camera-toggle" type="button" aria-label="Start scanning" title="Start scanning">
        <span class="pause-prompt" aria-hidden="true">
          <img class="barcode-icon" src="./barcode.png" width="128" height="96" alt="" />
          <span>Click to start barcode scanning</span>
        </span>
      </button>
    </div>
    <div id="camera-error" role="alert" hidden></div>
		<div id="qr-reader-results"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
